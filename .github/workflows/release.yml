name: Release

# Publica uma versão. Dois jeitos:
#   1) aumentar "version" no package.json e enviar para a main: se a release vX.Y.Z ainda não existe, ela é criada (com a tag);
#   2) criar a tag manualmente: git tag -a v1.0.0 -m "Pokémon Simulator Evolution v1.0.0" && git push origin v1.0.0
# O executável é compilado aqui (Go, sem dependências externas) e anexado à release junto com o .sha256 —
# é dali que o launcher instalado baixa e confere as atualizações.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Esta versão já tem release?
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "A release v$version já existe; nada a publicar."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.existing.outputs.skip != 'true'
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        if: steps.existing.outputs.skip != 'true'
        with:
          go-version: '1.24'
      - name: A tag precisa ser igual à versão do package.json
        if: steps.existing.outputs.skip != 'true'
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME difere da versão $version do package.json" >&2
            exit 1
          fi
      - run: npm ci --no-audit --no-fund
        if: steps.existing.outputs.skip != 'true'
      - run: npm run typecheck
        if: steps.existing.outputs.skip != 'true'
      - run: npm test
        if: steps.existing.outputs.skip != 'true'
      - name: Compilar a interface e o executável
        if: steps.existing.outputs.skip != 'true'
        run: npm run build:exe -- --out=dist/release/PokemonSimulatorEvolution.exe
      - name: Testes do launcher
        if: steps.existing.outputs.skip != 'true'
        run: go test ./...
        working-directory: launcher
      - name: Publicar a release
        if: steps.existing.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          args=(release create "$tag" dist/release/PokemonSimulatorEvolution.exe dist/release/PokemonSimulatorEvolution.exe.sha256
            --target "$GITHUB_SHA" --title "Pokémon Simulator Evolution $tag" --notes-file RELEASE_NOTES.md)
          case "$version" in *-*) args+=(--prerelease) ;; esac
          gh "${args[@]}"
