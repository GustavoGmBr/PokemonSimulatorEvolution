name: Release

# Publica uma versão. Dois jeitos:
#   1) aumentar "version" no package.json e enviar para a main: se a release vX.Y.Z ainda não existe, ela é criada (com a tag);
#   2) criar a tag manualmente: git tag -a v1.0.0 -m "Pokémon Simulator Evolution v1.0.0" && git push origin v1.0.0
# Os pacotes são montados aqui por scripts/build-release.mjs (launcher em Go + Node.js embutido + servidor SQLite + interface):
#   *-full-win-x64.zip    pasta do jogo completa (o que o jogador baixa)
#   *-update-win-x64.zip  .exe e app/ (o que o launcher instalado baixa e confere pelo .sha256)
#   PokemonSimulatorEvolution.exe  o launcher solto (+ .sha256): o .exe antigo (1.0.x) baixa este para se atualizar e, ao abrir,
#                                  instala o jogo a partir do pacote completo
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pacotes-windows:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Esta versão já tem release com o pacote completo?
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          if gh release view "v$version" --json assets -q '.assets[].name' 2>/dev/null | grep -q 'full-win-x64\.zip$'; then
            echo "A release v$version já tem o pacote completo; nada a publicar."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.existing.outputs.skip != 'true'
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        if: steps.existing.outputs.skip != 'true'
        with:
          go-version: '1.24'
      - name: A tag precisa ser igual à versão do package.json
        if: steps.existing.outputs.skip != 'true'
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME difere da versão $version do package.json" >&2
            exit 1
          fi
      - run: npm ci --no-audit --no-fund
        if: steps.existing.outputs.skip != 'true'
      - run: npm run typecheck
        if: steps.existing.outputs.skip != 'true'
      - run: npm test
        if: steps.existing.outputs.skip != 'true'
      - name: Testes do launcher
        if: steps.existing.outputs.skip != 'true'
        run: go test ./...
        working-directory: launcher
      - name: Baixar os recursos (branch "recursos")
        id: recursos
        if: steps.existing.outputs.skip != 'true'
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: recursos
          path: recursos-branch
      - name: Montar os pacotes (completo e de atualização)
        if: steps.existing.outputs.skip != 'true'
        run: |
          args=(--out=dist/release)
          if ls recursos-branch/*.zip >/dev/null 2>&1; then
            mkdir recursos-pack
            for z in recursos-branch/*.zip; do unzip -q -o "$z" -d recursos-pack; done
            test -d recursos-pack/recursos || { echo "::error::os .zip da branch recursos precisam conter a pasta recursos/"; exit 1; }
            echo "Recursos: $(find recursos-pack/recursos -type f | wc -l) arquivos"
            args+=(--recursos=recursos-pack/recursos)
          else
            echo "::warning::branch recursos ausente: o pacote completo sai sem imagens e músicas."
          fi
          node scripts/build-release.mjs "${args[@]}"
          ls -la dist/release
      - name: Publicar a release
        if: steps.existing.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          shopt -s nullglob
          # Release já existente sem o pacote completo (ex.: a primeira, só com o .exe): é apagada e recriada com tudo.
          if gh release view "$tag" >/dev/null 2>&1; then
            if ls dist/release/*-full-win-x64.zip >/dev/null 2>&1; then
              gh release delete "$tag" --cleanup-tag --yes
            else
              echo "::warning::a release $tag já existe e não há pacote completo para substituí-la."
              exit 0
            fi
          fi
          args=(release create "$tag" dist/release/*-full-win-x64.zip* dist/release/*-update-win-x64.zip* dist/release/PokemonSimulatorEvolution.exe*
            --target "$GITHUB_SHA" --title "Pokémon Simulator Evolution $tag" --notes-file RELEASE_NOTES.md)
          case "$version" in *-*) args+=(--prerelease) ;; esac
          gh "${args[@]}"
